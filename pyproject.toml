[project]
name = "aiact-rag"
version = "0.1.0"
description = "Retrieval layer (P1) and triage agent (P2) of the AI Act compliance triage reference system"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "fastembed>=0.9", "langgraph>=1.0"]

[project.optional-dependencies]
# The measuring instrument: the agent-reliability-lab harness, imported at a pinned commit
# (not copied), and the Inspect version that lab's lockfile pins.
eval = [
    "inspect-ai==0.3.252",
    "agent-reliability-lab @ git+https://github.com/anapsousa/agent-reliability-lab@5538ab88394c28edb8b6c6d67dd2415d7f031048",
]

[dependency-groups]
dev = ["pytest>=8"]

# Registers the `claude-code/<model-id>` Inspect provider (subscription-backed `claude -p`).
[project.entry-points.inspect_ai]
triage = "triage.inspect_provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact_rag", "src/triage"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Shared packages pinned to the lab uv.lock @ 5538ab8 (same list as eval/lab-constraints.txt).
